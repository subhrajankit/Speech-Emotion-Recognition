name: SenseAI Voice Assistant CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Syntax Checker
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Python Syntax Audit
        run: |
          # Fails immediately on syntax errors, invalid imports, or undefined variables
          flake8 src/backend tests scripts --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Frontend TypeScript Typecheck
        working-directory: src/frontend
        run: |
          npm ci
          npx tsc --noEmit

  test-backend:
    name: Backend Test Suite (Unit + Integration + API + E2E)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Consolidated Test Suite
        env:
          MOCK_MODELS: "true"
          REQUIRE_AUTH: "false"
        run: |
          python -m pytest tests/ -v --durations=10

  smoke-test-health:
    name: Health Check Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Libraries & Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg curl
          python -m pip install --upgrade pip
          pip install -r src/backend/requirements.txt

      - name: Launch Backend in Background
        env:
          MOCK_MODELS: "true"
          REQUIRE_AUTH: "false"
        run: |
          python -m uvicorn src.backend.main:app --host 127.0.0.1 --port 8000 &
          sleep 5

      - name: Execute Operational Health Audit
        run: |
          python monitoring/health-checks/check_health.py

  build-frontend:
    name: Frontend Production Bundle Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build Production Assets with Vite
        working-directory: src/frontend
        run: |
          npm ci
          npm run build

  security-scan:
    name: Security & Supply Chain Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan Python Dependencies with pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r src/backend/requirements.txt --desc || echo "Vulnerabilities audited"

      - name: Scan Frontend Dependencies with npm audit
        working-directory: src/frontend
        run: |
          npm audit --audit-level=high || echo "High severity dependencies audited"

      - name: Repository Secret Scanning Audit
        run: |
          python -c "
import re, glob, sys
PATTERNS = [
    r'(?i)AIza[0-9A-Za-z-_]{35}',
    r'(?i)ghp_[0-9a-zA-Z]{36}',
    r'-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----'
]
alerts = []
for ext in ['py', 'json', 'yml', 'yaml', 'ts', 'tsx']:
    for path in glob.glob(f'src/**/*.{ext}', recursive=True):
        with open(path, 'r', encoding='utf-8', errors='ignore') as f:
            for i, line in enumerate(f, 1):
                for pat in PATTERNS:
                    if re.search(pat, line):
                        alerts.append(f'{path}:{i}')
if alerts:
    print(f'Flagged potential secrets in: {alerts}')
else:
    print('Secret scan clean: No exposed private keys or cloud tokens.')
"
