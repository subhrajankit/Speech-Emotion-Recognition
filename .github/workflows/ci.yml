name: VoiceSense CI

"on":
  push:
    branches: [ main, master, "migration/**" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-isolation:
    name: Import Isolation & Decoupling Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Architectural Isolation
        run: |
          python scripts/ci/check_import_isolation.py

  backend-lite:
    name: Backend CI-Lite Test Suite (No Model Weights)
    runs-on: ubuntu-latest
    needs: import-isolation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install System Audio Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install CI-Lite Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run Pytest Lite Suite with Coverage
        run: |
          pytest -m "not model and not slow and not gpu and not postgres" \
            --cov=backend/app \
            --cov=ai \
            --cov=rag \
            --cov-report=term \
            --cov-report=xml \
            --durations=10

  frontend:
    name: Frontend Quality & Build (TypeScript + ESLint + Vitest + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: TypeScript Typecheck
        working-directory: frontend
        run: |
          npx tsc --noEmit

      - name: ESLint Code Quality
        working-directory: frontend
        run: |
          npm run lint

      - name: Unit & Component Tests
        working-directory: frontend
        run: |
          npm test

      - name: Production Bundle Build
        working-directory: frontend
        run: |
          npm run build
