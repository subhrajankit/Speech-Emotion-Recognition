[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voicesense"
version = "0.1.0"
description = "Multilingual, emotion-aware, fully local voice assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "soundfile>=0.12.1",
    "onnxruntime>=1.17.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
models = [
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "funasr>=1.0.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --ignore=tests/legacy"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "unit: marks fast unit tests",
    "integration: marks multi-component integration tests",
    "model: marks tests that require full model weights or heavy deep learning dependencies",
    "slow: marks slow-running tests",
    "gpu: marks tests requiring a physical GPU or CUDA acceleration",
    "postgres: marks tests that require a live PostgreSQL instance",
    "legacy: marks legacy tests excluded from default runs",
]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
