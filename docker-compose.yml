# ==============================================================================
# VoiceSense AI — Development Docker Compose Stack
# CPU by default; SQLite named volume; optional llama.cpp behind profile "llm".
# Usage:
#   docker compose up --build                  # Backend + Frontend (ASR/Emotion without LLM)
#   docker compose --profile llm up --build    # Include local Qwen3 llama.cpp server
# ==============================================================================

name: voicesense-dev

services:
  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
      args:
        USE_CUDA: "false"
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
    command:
      - uvicorn
      - backend.app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - "1"
      - --ws-ping-interval
      - "20"
      - --ws-ping-timeout
      - "20"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      HOST: "0.0.0.0"
      PORT: "8000"
      DEBUG: ${DEBUG:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./database/dev.db}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      JWT_SECRET: ${JWT_SECRET:-voicesense-dev-only-secret-change-in-prod-min-32-bytes}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://llm:8080}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-qwen3-1.7b}
      TTS_ENABLED: "false"
      SILERO_VAD_MODEL_PATH: ${SILERO_VAD_MODEL_PATH:-models/silero_vad.onnx}
      SENSEVOICE_MODEL_DIR: ${SENSEVOICE_MODEL_DIR:-iic/SenseVoiceSmall}
      SENSEVOICE_DEVICE: ${SENSEVOICE_DEVICE:-cpu}
      SENSEVOICE_THREADS: ${SENSEVOICE_THREADS:-4}
      INDICCONFORMER_MODEL_DIR: ${INDICCONFORMER_MODEL_DIR:-ai4bharat/indic-conformer-600m-multilingual}
      INDICCONFORMER_REVISION: ${INDICCONFORMER_REVISION:-2a77d305038dfc502fd9464e7d028b90381976cb}
      INDICCONFORMER_DEVICE: ${INDICCONFORMER_DEVICE:-cpu}
      INDICCONFORMER_DECODER_TYPE: ${INDICCONFORMER_DECODER_TYPE:-ctc}
      LAZY_LOAD_MODELS: ${LAZY_LOAD_MODELS:-true}
      PRELOAD_DEFAULT_ENGINE: ${PRELOAD_DEFAULT_ENGINE:-false}
      INFERENCE_CONCURRENCY_LIMIT: ${INFERENCE_CONCURRENCY_LIMIT:-2}
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - sqlite_dev_data:/app/database
      - ./models:/app/models:ro
      - ./data:/app/data
      - hf_cache:/cache/huggingface
      - modelscope_cache:/cache/modelscope
    mem_limit: ${BACKEND_MEM_LIMIT:-12g}
    restart: unless-stopped
    # Note: no hard depends_on on llm so ASR/emotion always starts and serves even without LLM.

  frontend:
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://127.0.0.1:8000/ws/speech}
      VITE_AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      VITE_ASR_ENGLISH_ONLY: ${VITE_ASR_ENGLISH_ONLY:-true}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command:
      - sh
      - -c
      - "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_started
    mem_limit: 512m
    restart: unless-stopped

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llm"]
    volumes:
      - ./models:/models:ro
    command:
      - -m
      - /models/${LLM_MODEL_FILE:-qwen3-1.7b.gguf}
      - --host
      - "0.0.0.0"
      - --port
      - "8080"
      - -c
      - "${LLM_CTX_SIZE:-4096}"
      - -ngl
      - "0"
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: ${LLM_MEM_LIMIT:-3g}
    restart: unless-stopped

volumes:
  sqlite_dev_data:
    name: voicesense_sqlite_dev_data
  frontend_node_modules:
    name: voicesense_frontend_node_modules
  hf_cache:
    name: voicesense_hf_cache
  modelscope_cache:
    name: voicesense_modelscope_cache
