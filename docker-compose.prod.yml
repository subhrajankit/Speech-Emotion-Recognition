# ==============================================================================
# SenseAI Voice Assistant — Production Docker Compose (Phase 12)
# Multi-service architecture with decoupled GPU model-serving & persistent DB
# ==============================================================================

services:
  # 1. Separated LLM Model Serving Service (GPU-accelerated llama.cpp)
  # Can be deployed on a dedicated GPU host by pointing backend LLAMA_CPP_URL to it.
  llm-server:
    image: ghcr.io/ggerganov/llama.cpp:server-cuda
    container_name: senseai-llm-prod
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./models:/models:ro
    command: >
      -m /models/qwen3-1.7b.gguf
      --host 0.0.0.0
      --port 8080
      -c 4096
      -ngl 33
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  # 2. FastAPI Audio Pipeline Backend (Lightweight CPU layer)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: senseai-backend-prod
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - MOCK_MODELS=false
      - LLAMA_CPP_URL=http://llm-server:8080/v1
      - REQUIRE_AUTH=true
      - DATABASE_PATH=database/prod.db
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./database:/app/database
    depends_on:
      - llm-server
      - db
    restart: always

  # 3. Production React Frontend served via Nginx Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: senseai-frontend-prod
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
    restart: always

  # 4. Production Relational Database
  db:
    image: postgres:16-alpine
    container_name: senseai-postgres-prod
    environment:
      - POSTGRES_USER=senseai
      - POSTGRES_PASSWORD=${DB_PASSWORD:-senseai_secure_prod_password}
      - POSTGRES_DB=senseai_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: always

volumes:
  postgres_data:
    name: senseai_postgres_data
